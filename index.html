<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inatel Carreiras</title>
    <meta name="description" content="Central acadêmica e mercado de trabalho do Inatel" />
    <meta name="theme-color" content="#0166c0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c4363" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        try {
          var salvo = JSON.parse(localStorage.getItem("tema"));
          var escuro = salvo
            ? salvo === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (escuro) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
